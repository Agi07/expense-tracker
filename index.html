<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <h1>Expense Tracker</h1>
    <p>Record what you spend and see where the money goes.</p>
  </header>

  <main class="app">

    <section class="panel" aria-labelledby="add-title">
      <h2 id="add-title">Add an expense</h2>
      <form id="expense-form" novalidate>
        <label for="description">Description</label>
        <input id="description" type="text" maxlength="60" placeholder="e.g. Taxi to campus">
        <p class="error" id="description-error" role="alert"></p>

        <label for="amount">Amount (R)</label>
        <input id="amount" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
        <p class="error" id="amount-error" role="alert"></p>

        <label for="category">Category</label>
        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Airtime &amp; data</option>
          <option>Education</option>
          <option>Entertainment</option>
          <option>Health</option>
          <option>Other</option>
        </select>

        <label for="date">Date</label>
        <input id="date" type="date">
        <p class="error" id="date-error" role="alert"></p>

        <button type="submit" class="btn">Add expense</button>
        <p class="status" id="form-status" role="status"></p>
      </form>
    </section>

    <section class="panel" aria-labelledby="summary-title">
      <h2 id="summary-title">Summary</h2>
      <label for="month-filter">Show</label>
      <select id="month-filter"></select>
      <p class="total">Total spent <strong id="total">R0.00</strong></p>
      <ul id="category-totals" class="category-totals"></ul>
    </section>

    <section class="panel panel--wide" aria-labelledby="list-title">
      <h2 id="list-title">Expenses</h2>
      <ul id="expense-list" class="expense-list"></ul>
      <p id="empty-message" class="empty">No expenses yet. Add your first one above.</p>
      <button type="button" class="btn" id="export-btn">Export to CSV</button>
    </section>

  </main>

  <script src="js/logic.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
